---
name: Build WASM

on: push

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM for Playground
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download tree-sitter-cli archive from release
        run: |
          wget -O tree-sitter.zip https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.9/tree-sitter-cli-linux-x86.zip
      - name: Unzip tree-sitter-cli archive
        run:  unzip tree-sitter.zip
      - name: Build WASM
        continue-on-error: true
        run: |
          chmod +x tree-sitter
          ./tree-sitter build --wasm
      - name: Check for OOM in kernel logs
        if: always()   # Run even if the previous step failed
        run: |
          echo "=== Kernel OOM messages ==="
          dmesg | grep -i "out of memory" || echo "No explicit OOM message found"
          echo "=== Last 50 lines of dmesg ==="
          dmesg | tail -50
      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-blade.wasm
          path: tree-sitter-blade.wasm
          retention-days: 30
